<div class="container mt-2">
  <div class="row">
    <div class="col-lg-12 offset-lg-2">
      <div class="card">
        <div class="card-body text-center">
          <h1 class="titulo">
            <strong>Pasarela de pago</strong>
          </h1>
        </div>
      </div>
    </div>
  </div>
  <div class="row mt-2">
    <div class="col-lg-6">
      <div class="card">
        <ng-container>
          <div class="card-body">
            <h2 class="text-center mb-3">
              <strong>Detalles de facturación</strong>
            </h2>
            <!--nombre-->
            <label for="name"><strong>Nombre</strong></label>
            <p>this.user.name</p>

            <!--Correo-->
            <label for="email"><strong>Correo</strong></label>
            <p>this.user.email</p>

            <!--Celular-->
            <label for="celphone"><strong>Celular</strong></label>
            <p>this.user.celphone</p>

            <!--chatId-->
            <label for="chatId"><strong>Id de Telegram</strong></label>
            <p>this.user.chatId</p>
          </div>
        </ng-container>
      </div>
    </div>

    <div class="col-lg-6">
      <div class="card">
        <div class="card-body">
          <h2 class="text-center mb-3">
            <strong>Detalles de la compra</strong>
          </h2>

          <!--Carrito de compras-->
          <ng-container *ngIf="this.cart">
            <div class="ps-block__content">
              <table class="table ps-block__products">
                <tbody>
                  <tr *ngFor="let cartItem of this.cart; let i = index">
                    <td>
                      <a (click)="this.goToProduct(cartItem.product)">{{
                        cartItem.product?.name
                      }}</a>
                      <p>
                        <strong>Cantidad: </strong>
                      </p>
                      <div class="quantity">
                        <input
                          type="number"
                          step="1"
                          min="1"
                          [max]="cartItem.product.stock"
                          name="quantity"
                          title="Qty"
                          class="input-text qty text"
                          size="4"
                          required
                          [(ngModel)]="cartItem.quantity"
                        />
                      </div>
                    </td>

                    <!--Eliminar-->
                    <td (click)="this.eliminarCartItem(cartItem)">
                      <i class="far fa-trash-alt text-danger"></i>
                    </td>

                    <td class="text-right">
                      {{ cartItem.product.price | currency : "USD" }}
                    </td>
                  </tr>
                </tbody>
              </table>

              <h3 class="text-right">
                <strong>Total: </strong>
                <span>{{ this.total | currency : "USD" }}</span>
              </h3>
            </div>
          </ng-container>
        </div>
      </div>
    </div>
